name: Zbuduj aplikację Android
on:
  push:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Skopiuj stronę do aplikacji
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Ustaw numer wersji
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName '1.0'/versionName '1.${{ github.run_number }}'/" android/app/build.gradle
      - name: Zbuduj APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk SerwisMaszyn.apk
      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Serwis Maszyn – aplikacja Android
          body: Pobierz SerwisMaszyn.apk na telefonie i zainstaluj. Nowszą wersję instalujesz na starą – dane zostają.
          files: SerwisMaszyn.apk
          make_latest: true
